# CRM dashboard + API proxy for direct backend.growerp.local access
server {
    listen 80;
    server_name backend.growerp.local;

    # CRM dashboard static files
    location /crm/ {
        alias /opt/crm-dashboard/;
        index index.html;
        try_files $uri $uri/ /crm/index.html;

        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
        add_header Access-Control-Allow-Headers "Authorization, Content-Type";
    }

    # Proxy REST/API calls to moqui backend (port 80 inside container)
    location / {
        proxy_pass http://moqui:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Increase timeouts for long-running requests
        proxy_connect_timeout 3600s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        client_max_body_size 20M;
    }
}
